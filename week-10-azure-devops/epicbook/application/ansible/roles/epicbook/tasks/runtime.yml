---
- name: Create the immutable runtime release directory
  ansible.builtin.file:
    path: "{{ app_runtime_dest }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Install the source-locked demo checkout release without changing the upstream clone
  ansible.builtin.unarchive:
    src: "{{ app_release_archive }}"
    dest: "{{ app_runtime_dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    creates: "{{ app_runtime_dest }}/RELEASE.json"

- name: Configure the local database for the historical single-VM deployment
  ansible.builtin.import_tasks: local-database.yml
  when: not (app_managed_db | default(false))

- name: Configure and migrate to private managed MySQL
  ansible.builtin.import_tasks: managed-database.yml
  when: app_managed_db | default(false)

- name: Inspect the existing pinned Node archive
  ansible.builtin.stat:
    path: "/var/cache/epicbook/node-v{{ node_version }}-linux-x64.tar.xz"
    checksum_algorithm: sha256
  register: epicbook_node_archive

- name: Download checksum-pinned supported Node LTS without shell installers
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-linux-x64.tar.xz"
    checksum: "sha256:{{ node_linux_x64_sha256 }}"
    dest: "/var/cache/epicbook/node-v{{ node_version }}-linux-x64.tar.xz"
    owner: root
    group: root
    mode: "0600"
  when: epicbook_node_archive.stat.checksum | default('') != node_linux_x64_sha256

- name: Extract the pinned Node runtime into a versioned root-owned directory
  ansible.builtin.unarchive:
    src: "/var/cache/epicbook/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: /opt
    remote_src: true
    owner: root
    group: root
    creates: "/opt/node-v{{ node_version }}-linux-x64/bin/node"

- name: Create a private npm cache for the source owner
  ansible.builtin.file:
    path: /var/cache/epicbook-npm
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0700"

- name: Inspect the revision-specific dependency marker
  ansible.builtin.stat:
    path: "/var/lib/epicbook-bootstrap/{{ app_release_id }}-node-{{ node_version }}.npm"
  register: epicbook_npm_marker

- name: Inspect installed dependencies
  ansible.builtin.stat:
    path: "{{ app_runtime_dest }}/node_modules/.package-lock.json"
  register: epicbook_npm_lock

- name: Install locked runtime dependencies without lifecycle scripts or a root npm process
  ansible.builtin.command:
    argv:
      - "/opt/node-v{{ node_version }}-linux-x64/bin/node"
      - "/opt/node-v{{ node_version }}-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
      - ci
      - --omit=dev
      - --ignore-scripts
      - --no-audit
      - --no-fund
    chdir: "{{ app_runtime_dest }}"
  environment:
    HOME: /var/cache/epicbook-npm
    npm_config_cache: /var/cache/epicbook-npm
    npm_config_umask: "0027"
  become: true
  become_user: "{{ app_user }}"
  when: epicbook_checkout.changed or not epicbook_npm_marker.stat.exists or not epicbook_npm_lock.stat.exists
  changed_when: true
  notify: Restart epicbook

- name: Record successful dependency installation
  ansible.builtin.copy:
    dest: "/var/lib/epicbook-bootstrap/{{ app_release_id }}-node-{{ node_version }}.npm"
    content: "{{ app_release_id }} node-{{ node_version }}\n"
    owner: root
    group: root
    mode: "0600"

- name: Create the private PM2 installation directory
  ansible.builtin.file:
    path: /opt/epicbook/pm2
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Install pinned PM2 without lifecycle scripts or root npm execution
  ansible.builtin.command:
    argv:
      - "/opt/node-v{{ node_version }}-linux-x64/bin/node"
      - "/opt/node-v{{ node_version }}-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
      - install
      - --prefix
      - /opt/epicbook/pm2
      - pm2@6.0.8
      - --omit=dev
      - --ignore-scripts
      - --no-audit
      - --no-fund
    creates: /opt/epicbook/pm2/node_modules/pm2/bin/pm2-runtime
  environment:
    HOME: /var/cache/epicbook-npm
    npm_config_cache: /var/cache/epicbook-npm
    npm_config_umask: "0027"
  become: true
  become_user: "{{ app_user }}"
  notify: Restart epicbook

- name: Render the root-readable service environment
  ansible.builtin.template:
    src: epicbook.env.j2
    dest: /etc/epicbook/epicbook.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart epicbook

- name: Render the restricted systemd service
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart epicbook

- name: Enable and start EpicBook
  ansible.builtin.systemd_service:
    name: epicbook
    daemon_reload: true
    enabled: true
    state: started

- name: Apply pending validated reloads and runtime restarts before probing
  ansible.builtin.meta: flush_handlers

- name: Require the real database-backed application response through Nginx
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/
    status_code: 200
    return_content: true
    use_proxy: false
  register: epicbook_http
  until: epicbook_http.status | default(0) == 200
  retries: 12
  delay: 5
  changed_when: false

- name: Reject a successful status from an unrelated page
  ansible.builtin.assert:
    that:
      - "'EpicBook' in epicbook_http.content"
  when: not ansible_check_mode
