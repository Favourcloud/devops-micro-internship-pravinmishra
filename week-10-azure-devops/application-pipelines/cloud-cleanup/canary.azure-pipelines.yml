# Source-only, canary-only. No definition, connection, schedule or cleanup is armed by this file.
trigger: none
pr: none
schedules:
  - cron: '*/15 * * * *'
    displayName: Fixed-deadline canary retry (UTC)
    branches:
      include: [main]
    always: true
    batch: false

lockBehavior: runLatest
stages:
  - stage: CanaryCleanup
    jobs:
      - deployment: IndependentHostedCleanup
        displayName: Delete only the approved empty canary RG and VPC
        environment: DMI-Week10-Cleanup-Canary
        pool:
          vmImage: ubuntu-24.04
        timeoutInMinutes: 45
        cancelTimeoutInMinutes: 2
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - task: DownloadSecureFile@1
                  name: canaryConfig
                  inputs:
                    secureFile: __APPROVED_CANARY_CONFIG_FILE__
                - bash: |
                    set +x
                    set -euo pipefail
                    umask 077
                    python3 -I -B -c 'import json,os,re; c=json.load(open(os.environ["CANARY_CONFIG"])); assert c.get("kind")=="canary" and type(c.get("armed")) is bool; s=c.get("source_commit") if c["armed"] else "UNARMED"; assert s=="UNARMED" or (isinstance(s,str) and re.fullmatch("[a-f0-9]{40}",s) and s!="0"*40); print(s)' > source-sha.txt
                    IFS= read -r source_sha < source-sha.txt
                    if [ "$source_sha" = UNARMED ]; then
                      printf '%s\n' '##vso[task.setvariable variable=canaryDue]false' 'Canary is unarmed.'
                      exit 0
                    fi
                    git init --quiet source
                    git -C source remote add origin https://github.com/Favourcloud/devops-micro-internship-pravinmishra.git
                    git -C source sparse-checkout set week-10-azure-devops/application-pipelines/cloud-cleanup
                    git -C source -c protocol.file.allow=never fetch --quiet --filter=blob:none --depth=1 origin "$source_sha"
                    git -C source checkout --quiet --detach FETCH_HEAD
                    python3 -I -B source/week-10-azure-devops/application-pipelines/cloud-cleanup/worker.py ready --config "$CANARY_CONFIG"
                  displayName: Verify the protected lease and fetch its frozen public source
                  workingDirectory: $(Agent.TempDirectory)
                  env:
                    CANARY_CONFIG: $(canaryConfig.secureFilePath)
                    GIT_TERMINAL_PROMPT: '0'
                    GIT_CONFIG_NOSYSTEM: '1'
                - bash: |
                    set +x
                    set -euo pipefail
                    umask 077
                    mkdir tooling
                    curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip --output tooling/terraform.zip
                    printf '%s\n' '0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a  tooling/terraform.zip' | sha256sum --check --status
                    unzip -q tooling/terraform.zip terraform -d tooling
                  condition: and(succeeded(), eq(variables['canaryDue'], 'true'))
                  displayName: Verify the pinned Terraform archive (hosted canary only)
                  workingDirectory: $(Agent.TempDirectory)
                - task: AzureCLI@2
                  condition: and(succeeded(), eq(variables['canaryDue'], 'true'))
                  displayName: Federated canary cleanup; no root keys or PAT
                  inputs:
                    azureSubscription: __RESTRICTED_ARM_WIF_CONNECTION_UUID__
                    addSpnToEnvironment: true
                    useGlobalConfig: false
                    visibleAzLogin: false
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set +x
                      set -euo pipefail
                      umask 077
                      python3 -I -B "$AGENT_TEMPDIRECTORY/source/week-10-azure-devops/application-pipelines/cloud-cleanup/worker.py" run --config "$CANARY_CONFIG" --terraform "$AGENT_TEMPDIRECTORY/tooling/terraform"
                  env:
                    CANARY_CONFIG: $(canaryConfig.secureFilePath)
