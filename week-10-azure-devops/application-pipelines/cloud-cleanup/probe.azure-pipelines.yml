# Manual, read-only federation metadata probe. Import the frozen source before creating a definition.
trigger: none
pr: none
pool:
  vmImage: ubuntu-24.04
jobs:
  - job: FederatedMetadata
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false
      - task: AzureCLI@2
        inputs:
          azureSubscription: __RESTRICTED_ARM_WIF_CONNECTION_UUID__
          addSpnToEnvironment: true
          useGlobalConfig: false
          visibleAzLogin: false
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set +x
            set -euo pipefail
            python3 -I -B week-10-azure-devops/application-pipelines/cloud-cleanup/probe_claims.py
