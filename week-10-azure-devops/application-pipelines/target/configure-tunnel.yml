---
- name: Create the isolated forwarding group
  ansible.builtin.group:
    name: week10tunnel
    state: present

- name: Create the locked forwarding-only account
  ansible.builtin.user:
    name: week10tunnel
    group: week10tunnel
    groups: ''
    append: false
    home: /home/week10tunnel
    create_home: true
    shell: /usr/sbin/nologin
    password_lock: true
    state: present

- name: Verify the forwarding account UID
  ansible.builtin.command:
    argv: [/usr/bin/id, -u, week10tunnel]
  register: week10_tunnel_uid
  changed_when: false

- name: Verify forwarding account groups
  ansible.builtin.command:
    argv: [/usr/bin/id, -Gn, week10tunnel]
  register: week10_tunnel_groups
  changed_when: false

- name: Verify sudo remains denied for the forwarding account
  ansible.builtin.command:
    argv: [/usr/bin/sudo, -n, -l, -U, week10tunnel]
  environment: {LC_ALL: C}
  register: week10_tunnel_sudo
  changed_when: false
  failed_when: false
  no_log: true

- name: Refuse privileged forwarding identities
  ansible.builtin.assert:
    that:
      - week10_tunnel_uid.stdout | int >= 1000
      - week10_tunnel_groups.stdout == 'week10tunnel'
      - week10_tunnel_sudo.rc == 1
      - "'is not allowed to run sudo on' in (week10_tunnel_sudo.stdout ~ week10_tunnel_sudo.stderr)"

- name: Protect the forwarding home and authorized-key directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: week10tunnel
    group: week10tunnel
    mode: '0700'
  loop: [/home/week10tunnel, /home/week10tunnel/.ssh]

- name: Restrict forwarding at EOF and validate the complete SSH configuration
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: '# {mark} DMI WEEK10 FORWARDING ONLY'
    insertafter: EOF
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
    block: |
      Match User week10tunnel
          AuthenticationMethods publickey
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AllowAgentForwarding no
          AllowTcpForwarding local
          AllowStreamLocalForwarding no
          PermitOpen 127.0.0.1:22
          PermitListen none
          PermitTTY no
          X11Forwarding no
          MaxSessions 0
          ForceCommand /usr/sbin/nologin
  notify: Reload validated SSH restrictions

- name: Inspect effective restrictions before activating the forwarding key
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -T, -C, "user=week10tunnel,host=localhost,addr={{ week10_target.agent_ipv4 }}"]
  register: week10_effective_sshd
  changed_when: false
  no_log: true

- name: Fail closed if global SSH settings override the intended restrictions
  ansible.builtin.assert:
    that:
      - item in week10_effective_sshd.stdout_lines
  loop:
    - authenticationmethods publickey
    - pubkeyauthentication yes
    - passwordauthentication no
    - kbdinteractiveauthentication no
    - allowagentforwarding no
    - allowtcpforwarding local
    - allowstreamlocalforwarding no
    - permitopen 127.0.0.1:22
    - permitlisten none
    - permittty no
    - x11forwarding no
    - maxsessions 0
    - forcecommand /usr/sbin/nologin
    - disableforwarding no
    - usepam yes

- name: Apply validated restrictions before any forwarding key is authorized
  ansible.builtin.meta: flush_handlers

- name: Authorize only the separate forwarding key from the actual agent source
  ansible.builtin.copy:
    content: 'restrict,port-forwarding,from="{{ week10_target.agent_ipv4 }}/32",permitopen="127.0.0.1:22" {{ week10_target.tunnel_public_key }}{{ "\n" }}'
    dest: /home/week10tunnel/.ssh/authorized_keys
    owner: week10tunnel
    group: week10tunnel
    mode: '0600'

- name: Record forwarding-account ownership after successful restriction setup
  ansible.builtin.copy:
    content: '{{ week10_target.assignment }}{{ "\n" }}'
    dest: /etc/ssh/.dmi-week10-tunnel
    owner: root
    group: root
    mode: '0644'
