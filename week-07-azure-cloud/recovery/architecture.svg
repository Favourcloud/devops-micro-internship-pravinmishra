<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="870" viewBox="0 0 1480 870"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#56708d"/></marker></defs><rect width="1480" height="870" fill="#f4f7fb"/><text x="44" y="54" font-family="Arial,sans-serif" font-size="32" fill="#1a334b">Week 07 | Eze Favour | Azure three-tier Book Review</text><text x="44" y="88" font-family="Arial,sans-serif" font-size="19" fill="#1a334b">Dedicated recovery lab · Sweden Central · Separate from the retained Week 08–10 demonstrations</text><rect x="510" y="118" width="460" height="95" rx="12" fill="#e2efff" stroke="#9ab0c7" stroke-width="2"/><text x="530" y="153" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Public Standard Load Balancer</text><text x="530" y="184" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">HTTP entry, probe, two web targets</text><text x="640" y="112" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Internet users</text><path d="M740,100 L740,117" stroke="#56708d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="244" width="1416" height="462" rx="14" fill="#eaf2ea" stroke="#8db18b" stroke-width="2"/><text x="56" y="277" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">week07-three-tier-vnet · 10.0.0.0/16 · NSGs enforce the permitted flows</text><rect x="60" y="309" width="400" height="197" rx="12" fill="#ffffff" stroke="#9ab0c7" stroke-width="2"/><text x="80" y="344" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Presentation subnet · 10.0.1.0/24</text><text x="80" y="375" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">web1 (zone 1) + web2 (zone 2)</text><text x="80" y="402" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Private NICs; no direct public IP</text><text x="80" y="429" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Nginx → Next.js on localhost</text><text x="80" y="456" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">/api → internal application LB</text><rect x="540" y="309" width="400" height="197" rx="12" fill="#ffffff" stroke="#9ab0c7" stroke-width="2"/><text x="560" y="344" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Application subnet · 10.0.4.0/24</text><text x="560" y="375" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Internal LB · 10.0.4.100:5000</text><text x="560" y="402" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">app1 (zone 1) + app2 (zone 2)</text><text x="560" y="429" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Private NICs; Node.js API</text><text x="560" y="456" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Only web subnet can reach API</text><rect x="1020" y="309" width="400" height="197" rx="12" fill="#ffffff" stroke="#9ab0c7" stroke-width="2"/><text x="1040" y="344" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Database subnet · 10.0.2.0/24</text><text x="1040" y="375" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Azure MySQL Flexible Server</text><text x="1040" y="402" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Public network access disabled</text><text x="1040" y="429" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">TLS certificate verification enabled</text><text x="1040" y="456" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">7-day backups; single DB instance</text><path d="M630,214 L300,306" stroke="#56708d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M462,411 L536,411" stroke="#56708d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M943,411 L1017,411" stroke="#56708d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="554" width="400" height="115" rx="12" fill="#ffffff" stroke="#9ab0c7" stroke-width="2"/><text x="80" y="589" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Separate A5 workload</text><text x="80" y="620" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">EpicBook VM: frontend + private process</text><text x="80" y="647" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Public HTTP; SSH limited to operator /32</text><rect x="540" y="554" width="400" height="115" rx="12" fill="#ffffff" stroke="#9ab0c7" stroke-width="2"/><text x="560" y="589" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Key Vault + managed identity</text><text x="560" y="620" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Application secrets; no values in Git</text><text x="560" y="647" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">App VMs have secret Get permission only</text><rect x="1020" y="554" width="400" height="115" rx="12" fill="#ffffff" stroke="#9ab0c7" stroke-width="2"/><text x="1040" y="589" font-family="Arial,sans-serif" font-size="24" fill="#1a334b">Operational controls</text><text x="1040" y="620" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">NAT for private outbound connections</text><text x="1040" y="647" font-family="Arial,sans-serif" font-size="18" fill="#1a334b">Load-balancer health metric alert</text><path d="M740,506 L740,551" stroke="#56708d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="751" font-family="Arial,sans-serif" font-size="20" fill="#1a334b">Database users are separated: bookapp → bookreview; epicapp → bookstore. Each has CRUD privileges only.</text><text x="48" y="785" font-family="Arial,sans-serif" font-size="20" fill="#1a334b">Test: stop web1 Nginx; wait for probes; verify database-backed responses through web2.</text><text x="48" y="821" font-family="Arial,sans-serif" font-size="20" fill="#1a334b">The database is a single-instance lab configuration, not a claim of end-to-end production high availability.</text></svg>