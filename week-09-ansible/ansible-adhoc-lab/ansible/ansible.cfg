[defaults]
inventory = ./inventory.ini
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 4
timeout = 10
local_tmp = ../.ansible/tmp

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
control_path_dir = ../.ansible/cp
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UserKnownHostsFile=../.local/known_hosts -o GlobalKnownHostsFile=/dev/null
