---
- name: Refuse unconfigured or unapproved execution before any SSH
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require exactly one explicitly approved SSH target
      ansible.builtin.assert:
        that:
          - deployment_approved | default(false) | bool
          - groups.get('web', []) | length == 1
        fail_msg: >-
          STOP: preparation only. Use the validated inventory renderer and obtain current
          budget/access approval before setting deployment_approved=true. No remote action taken.

    - name: Reject local connections and unsupported administrative users
      ansible.builtin.assert:
        that:
          - hostvars[groups['web'][0]].ansible_connection | default('') == 'ssh'
          - hostvars[groups['web'][0]].ansible_user | default('') == 'ubuntu'
          - hostvars[groups['web'][0]].ansible_host | default('') is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
          - hostvars[groups['web'][0]].ansible_host | default('') is not match('^(0|127|169\.254)\.')

- name: Prepare the dedicated Ubuntu EpicBook server
  hosts: web
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require approval and a single valid target even when localhost is excluded
      ansible.builtin.assert:
        that:
          - deployment_approved | default(false) | bool
          - groups.get('web', []) | length == 1
          - inventory_hostname == groups['web'][0]
          - hostvars[inventory_hostname].ansible_connection | default('') == 'ssh'
          - hostvars[inventory_hostname].ansible_user | default('') == 'ubuntu'
          - hostvars[inventory_hostname].ansible_host | default('') is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
          - hostvars[inventory_hostname].ansible_host | default('') is not match('^(0|127|169\.254)\.')
        fail_msg: >-
          STOP: preparation only. Exactly one validated SSH target and current
          budget/access approval are required before setting deployment_approved=true. No remote action taken.
      delegate_to: localhost
      become: false
      tags: always

    - name: Validate the reviewed source and filesystem boundaries before SSH
      ansible.builtin.assert:
        that:
          - app_repo == 'https://github.com/pravinmishraaws/theepicbook.git'
          - app_revision == '763becebb8d3f5663a76bb30facddc25be63cfd5'
          - app_dest == '/opt/epicbook/source'
          - app_user == 'epicbook-deploy'
          - app_group == 'epicbook'
          - app_runtime_user == 'epicbook'
          - app_port | int == 8080
          - app_db_name == 'bookstore'
          - app_db_user == 'epicbook'
          - app_runtime_enabled is boolean
          - not app_runtime_enabled or app_runtime_compatibility_acknowledged | bool
          - node_version == '22.23.2'
          - node_linux_x64_sha256 == 'd60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307'
      delegate_to: localhost
      become: false

    - name: Require a secret-safe database password for opt-in runtime installation
      ansible.builtin.assert:
        that:
          - vault_epicbook_db_password | default('') is match('^[A-Za-z0-9_-]{32,128}$')
          - vault_epicbook_session_secret | default('') is match('^[A-Za-z0-9_-]{32,128}$')
          - app_release_id | default('') is match('^[a-f0-9]{64}$')
          - app_runtime_dest == '/opt/epicbook/releases/' + app_release_id
        fail_msg: Supply a 32-128 character URL-safe password using a local encrypted Ansible Vault file.
      delegate_to: localhost
      become: false
      no_log: true
      when: app_runtime_enabled

    - name: Gather target facts only after all controller-side guards pass
      ansible.builtin.setup:

    - name: Require the reviewed Ubuntu release and CPU architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '22.04'
          - ansible_facts['architecture'] == 'x86_64'

  roles:
    - common
    - nginx
    - epicbook
  post_tasks:
    - name: Remove the explicitly disposable Week09 risk-drill marker
      ansible.builtin.file:
        path: /var/tmp/dmi-week09-risk-marker
        state: absent
