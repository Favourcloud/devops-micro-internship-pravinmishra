---
- name: Install Nginx without auto-starting the distribution default site
  ansible.builtin.apt:
    name: nginx
    state: present
    policy_rc_d: 101
    lock_timeout: 120

- name: Render the EpicBook virtual host
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the EpicBook site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook
    dest: /etc/nginx/sites-enabled/epicbook
    state: link
    owner: root
    group: root
  notify: Reload nginx

- name: Remove the enabled distribution default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate the assembled configuration before starting Nginx
  ansible.builtin.command:
    argv: [/usr/sbin/nginx, -t]
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
