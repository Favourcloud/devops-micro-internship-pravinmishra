pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 resolver 127.0.0.11 valid=5s ipv6=off;
 access_log /dev/stdout; error_log /dev/stderr warn;
 client_body_temp_path /tmp/client; proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /health { access_log off; return 200 'ready'; }
  location /assets/ { try_files $uri =404; }
  location / {
   set $pages http://backend:8080;
   proxy_pass $pages;
   proxy_set_header Host $http_host;
   proxy_connect_timeout 2s; proxy_read_timeout 8s;
  }
 }
}
