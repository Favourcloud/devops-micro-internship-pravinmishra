pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 map $http_x_dmi_viewer_scheme $viewer_scheme { default $scheme; https https; }
 resolver 127.0.0.11 valid=5s ipv6=off;
 log_format json escape=json '{"at":"$time_iso8601","service":"proxy","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
 access_log /var/log/nginx/access.log json; error_log /var/log/nginx/error.log warn;
 client_body_temp_path /tmp/client; proxy_temp_path /tmp/proxy; fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
 limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
 server {
  listen 8080;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location ~ /\. { deny all; }
  location = /health { access_log off; return 200 'ok'; }
  location /api/ {
   limit_req zone=api burst=30 nodelay;
   set $api http://backend:8080;
   proxy_pass $api;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $viewer_scheme;
   proxy_connect_timeout 2s; proxy_read_timeout 8s;
  }
  location / {
   set $web http://frontend:8080;
   proxy_pass $web;
   proxy_set_header Host $http_host;
   proxy_connect_timeout 2s; proxy_read_timeout 8s;
  }
 }
}
