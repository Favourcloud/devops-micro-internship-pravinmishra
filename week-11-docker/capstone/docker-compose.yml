name: week11-epicbook
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 120
  tmpfs: ['/tmp:size=64m,mode=1777']
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  reverse-proxy:
    <<: *hardening
    image: nginx@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    user: '101:101'
    ports: ['80:8080']
    networks: [front-tier]
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    mem_limit: 128m
  frontend:
    <<: *hardening
    image: epicbook-frontend:1.0.0
    build: ./frontend
    networks: [front-tier]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 256m
  backend:
    <<: *hardening
    image: epicbook-backend:1.0.0
    build: ./backend
    networks: [front-tier, back-tier]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the public HTTP/HTTPS origins}
    secrets: [db_password, session]
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 512m
  database:
    image: mysql@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [back-tier]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root
      MYSQL_DATABASE: bookstore
      MYSQL_USER: epicapp
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_root, db_password]
    volumes:
      - database-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$(cat /run/secrets/db_password) mysql -h 127.0.0.1 -u epicapp bookstore -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1200m
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  front-tier: {}
  back-tier: {internal: true}
volumes:
  database-data: {}
secrets:
  db_root: {file: ./secrets/db_root}
  db_password: {file: ./secrets/db_password}
  session: {file: ./secrets/session}
