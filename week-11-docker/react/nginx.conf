pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 access_log /dev/stdout; error_log /dev/stderr warn;
 client_body_temp_path /tmp/client; proxy_temp_path /tmp/proxy; fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
 server { listen 8080; server_tokens off; root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 location = /health { access_log off; return 200 'ok'; }
 location / { try_files $uri $uri/ /index.html; }
 location /static/ { add_header Cache-Control "public,max-age=31536000,immutable"; }
 }
}
